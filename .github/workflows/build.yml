
name: NIVEK ECLIPSE - Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Verificar arquivos do projeto
        run: |
          echo "Verificando estrutura..."
          test -f build.gradle || test -f build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts
          echo "Arquivos principais encontrados!"

      - name: Verificar Gradle
        run: gradle --version

      - name: Compilar NIVEK ECLIPSE
        run: gradle build --no-daemon --stacktrace

      - name: Publicar arquivo JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NIVEK-ECLIPSE-Fabric-1.21.8
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
