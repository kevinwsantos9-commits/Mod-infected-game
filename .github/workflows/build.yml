name: build

# Roda a cada atualizacao do mod (push, pull request) e manualmente.
# - Sempre compila e guarda o .jar em Actions > build > Artifacts.
# - Em push na branch main/master gera uma Release "build-N" com o .jar.
# - Ao criar uma tag v* (ex.: v0.2.0) gera uma Release com o nome da tag.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necessario para criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle build --stacktrace

      - name: Separar o jar principal (sem o -sources)
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" dist/
          ls -l dist

      - name: Guardar o jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nivek-eclipse-${{ github.run_number }}
          path: dist/*.jar

      - name: Publicar Release (push em main/master ou tag)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('NIVEK ECLIPSE - build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: dist/*.jar
